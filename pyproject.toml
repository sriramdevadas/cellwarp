[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellwarp"
version = "0.1.0"
description = "Cross-species geometric morphometrics in transcriptomic space"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12,<3.13"
authors = [
    {name = "Sriram Devadas", email = "sriram@sriramdevadas.com"},
]
keywords = [
    "Procrustes analysis",
    "cross-species transcriptomics",
    "cell type evolution",
    "single-cell RNA-seq",
    "covariance conservation",
    "cell type homology",
]

# CORE: minimum to `import cellwarp` and use the library
dependencies = [
    "numpy>=2.4,<2.5",
    "scipy>=1.17,<1.18",
    "scikit-learn>=1.8,<1.9",
    "pandas>=2.3,<2.4",
    "anndata>=0.12,<0.13",
    "scanpy>=1.12,<1.13",
    "h5py>=3.16",
    "tqdm>=4.65",
]

[project.optional-dependencies]
reproduce = [
    "matplotlib>=3.10,<3.11",
    "seaborn>=0.13,<0.14",
    "adjustText>=1.3",
    "statsmodels>=0.14",
    "cellxgene-census>=1.17",
    "tiledbsoma>=2.3",
    "gseapy>=1.0",
    "pybiomart>=0.2",
    "networkx>=3.6",
    "decoupler>=2.1",
    "openpyxl>=3.1",
    "requests>=2.31",
    "pymupdf>=1.23",
    "python-docx>=1.1",
]
samap = [
    "samap>=1.0.14",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pyyaml>=6.0",
]
lock = [
    # Exact pins for manuscript reproducibility, taken from the freeze in requirements.txt.
    # See manuscript Methods (Software & reproducibility) and Data and Code Availability.
    "numpy==2.4.3",
    "scipy==1.17.1",
    "scikit-learn==1.8.0",
    "pandas==2.3.3",
    "anndata==0.12.10",
    "scanpy==1.12",
    "h5py==3.16.0",
    "tqdm==4.67.3",
    "matplotlib==3.10.8",
    "seaborn==0.13.2",
    "adjustText==1.3.0",
    "statsmodels==0.14.6",
    "cellxgene-census==1.17.0",
    "tiledbsoma==2.3.0",
    "gseapy==1.2.1",
    "pybiomart==0.2.0",
    "networkx==3.6.1",
    "decoupler==2.1.4",
    "openpyxl==3.1.5",
    "requests==2.32.5",
    "samap==1.0.14",
    "jupyter==1.1.1",
    "pymupdf==1.27.2.3",
    "pyBigWig==0.3.25",
]

[project.urls]
Repository = "https://github.com/sriramdevadas/cellwarp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
